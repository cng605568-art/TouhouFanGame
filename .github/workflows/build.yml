# Builds Fumo Court with the official Ren'Py SDK.
#
#   Push a tag like v0.1.0  ->  Windows .zip + HTML5 .zip attached to a GitHub Release
#   Actions tab > "Build & Release" > Run workflow  ->  same builds as downloadable artifacts only
#
# The tag must match config.version in game/options.rpy (v0.1.0 <-> "0.1.0").

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  RENPY_VERSION: "8.3.7"
  # No display or sound card on the runner.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  build:
    name: Windows + Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the game
        uses: actions/checkout@v4
        with:
          path: FumoCourt

      - name: Restore cached Ren'Py SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: renpy-sdk
          key: renpy-sdk-${{ env.RENPY_VERSION }}-with-web

      - name: Download Ren'Py SDK and web support
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://www.renpy.org/dl/${RENPY_VERSION}"
          curl -fL --retry 4 --retry-delay 5 -o sdk.tar.bz2 "${base}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          curl -fL --retry 4 --retry-delay 5 -o web.zip "${base}/renpy-${RENPY_VERSION}-web.zip"
          tar -xjf sdk.tar.bz2
          mv "renpy-${RENPY_VERSION}-sdk" renpy-sdk
          # The web package unpacks a web/ folder into the SDK root.
          unzip -q web.zip -d web-unpacked
          if [ -d web-unpacked/web ]; then
            mv web-unpacked/web renpy-sdk/web
          else
            mv "$(dirname "$(find web-unpacked -name index.html | head -n 1)")" renpy-sdk/web
          fi
          test -f renpy-sdk/web/index.html
          rm -rf sdk.tar.bz2 web.zip web-unpacked

      - name: Read game version
        id: meta
        run: |
          set -euo pipefail
          version="$(sed -n 's/^define config\.version = "\(.*\)"$/\1/p' FumoCourt/game/options.rpy)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Fumo Court ${version}"

      - name: Check tag matches config.version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.meta.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match config.version ${{ steps.meta.outputs.version }} in game/options.rpy"
            exit 1
          fi

      - name: Lint
        working-directory: renpy-sdk
        run: ./renpy.sh "${GITHUB_WORKSPACE}/FumoCourt" lint --error-code

      - name: Build Windows package
        working-directory: renpy-sdk
        run: >
          ./renpy.sh launcher distribute "${GITHUB_WORKSPACE}/FumoCourt"
          --package win
          --destination "${GITHUB_WORKSPACE}/dists"

      - name: Build web package
        working-directory: renpy-sdk
        run: |
          set -euo pipefail
          # Selecting the project lets the web build find web-presplash.png.
          ./renpy.sh launcher set_project "${GITHUB_WORKSPACE}/FumoCourt"
          ./renpy.sh launcher web_build "${GITHUB_WORKSPACE}/FumoCourt" \
            --destination "${GITHUB_WORKSPACE}/dists/FumoCourt-${{ steps.meta.outputs.version }}-web"

      - name: Check packages
        run: |
          set -euo pipefail
          ls -la dists
          win="dists/FumoCourt-${{ steps.meta.outputs.version }}-win.zip"
          web="dists/FumoCourt-${{ steps.meta.outputs.version }}-web.zip"
          test -f "$win" && test -f "$web"
          unzip -Z1 "$win" > win-files.txt
          unzip -Z1 "$web" > web-files.txt
          grep -q "FumoCourt.exe$" win-files.txt
          grep -q "^index.html$" web-files.txt
          grep -q "^game.zip$" web-files.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FumoCourt-${{ steps.meta.outputs.version }}
          path: |
            dists/FumoCourt-${{ steps.meta.outputs.version }}-win.zip
            dists/FumoCourt-${{ steps.meta.outputs.version }}-web.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Fumo Court ${{ github.ref_name }}
          files: |
            dists/FumoCourt-${{ steps.meta.outputs.version }}-win.zip
            dists/FumoCourt-${{ steps.meta.outputs.version }}-web.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Optional: with a BUTLER_API_KEY secret and an ITCH_GAME variable
      # (e.g. "yourname/fumo-court"), tagged builds also go to itch.io.
      - name: Push to itch.io
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY}" ] || [ -z "${ITCH_GAME}" ]; then
            echo "No BUTLER_API_KEY secret or ITCH_GAME variable: skipping itch.io."
            exit 0
          fi
          curl -fL --retry 3 -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          v="${{ steps.meta.outputs.version }}"
          ./butler/butler push "dists/FumoCourt-${v}-win.zip" "${ITCH_GAME}:windows" --userversion "$v"
          ./butler/butler push "dists/FumoCourt-${v}-web.zip" "${ITCH_GAME}:html5" --userversion "$v"
